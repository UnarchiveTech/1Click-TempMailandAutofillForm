<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360, initial-scale=1.0">
  <!-- WXT lifts this <title> into the manifest's `action.default_title`, so it must
       stay a `__MSG_*__` placeholder - Chrome resolves placeholders in the
       manifest (and CSS), never in HTML. A popup renders no title bar, so the
       literal placeholder is never shown; the live document.title is set to the
       localized name at runtime by AppLayout (actionTitle.tempMailAndAutofill). -->
  <title>__MSG_extName__</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
