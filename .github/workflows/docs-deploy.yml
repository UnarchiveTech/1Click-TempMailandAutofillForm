name: Deploy 1Click Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'scripts/docs-*.ts'
      - 'tests/e2e/docs-screenshots.e2e.ts'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'wxt.config.ts'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bun x playwright install --with-deps chromium

      - name: Build extension used by screenshots
        run: bun run build

      - name: Capture real-extension screenshots
        run: xvfb-run -a bun x playwright test tests/e2e/docs-screenshots.e2e.ts --project=extension-chrome

      - name: Build documentation site
        run: bun run docs:build

      - name: Validate documentation links
        run: bun run docs:check-links

      - name: Deploy documentation to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs-site/dist
          clean: true
          clean-exclude: |
            pr-preview/
          cname: docs.unarchive.tech
